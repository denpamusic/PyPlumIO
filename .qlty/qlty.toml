# Configuration for Qlty CLI and Qlty Cloud (https://qlty.sh)
config_version = "0"

# Exclude generated, build, documentation, cache, and virtual environment directories
exclude_patterns = [
  "**/.git/**",
  "**/.mypy_cache/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/.tox/**",
  "**/.venv/**",
  "**/.vscode/**",
  "**/build/**",
  "**/docs/**",
  "**/testdata/**",
]

test_patterns = ["**/tests/**", "**/*.test_*"]

[coverage]
paths = ["coverage.lcov"]

[smells]
mode = "comment"

# Match complexipy's max-complexity-allowed = 15
[smells.function_complexity]
threshold = 15

# Match Ruff's PLR0911 (max 6 return statements)
[smells.return_statements]
threshold = 7

# Disable whole-file complexity (not used by complexipy or ruff)
[smells.file_complexity]
enabled = false

# Allow wider signatures (mirrors ignoring PLR0913/PLR0917 in pyproject.toml)
[smells.function_parameters]
threshold = 10

[smells.duplication]
nodes_threshold = 165

# Ignore GitHub Actions workflow false positives (truthy "on:", line length, trailing empty lines)
[[triage]]
match.rules = ["yamllint:truthy", "yamllint:line-length", "yamllint:empty-lines"]
match.file_patterns = [".github/workflows/**"]
set.ignored = true

# Ignore line length and list numbering in markdown documentation
[[triage]]
match.rules = ["markdownlint:MD013", "markdownlint:MD029"]
match.file_patterns = ["*.md", "**/*.md"]
set.ignored = true

# Ignore bandit findings in test files
[[triage]]
match.plugins = ["bandit"]
match.file_patterns = ["tests/**", "**/tests/**"]
set.ignored = true

# 0.0.0.0 is a default placeholder IP, not a socket bind address
[[triage]]
match.rules = ["bandit:B104"]
match.file_patterns = ["pyplumio/structures/network_info.py"]
set.ignored = true

# Ignore unused **kwargs in frame base classes
[[triage]]
match.rules = ["radarlint-python:python:S1172"]
match.file_patterns = ["pyplumio/frames/__init__.py"]
set.ignored = true

# Ignore float equality assertions in unit tests
[[triage]]
match.rules = ["radarlint-python:python:S1244"]
match.file_patterns = ["tests/**", "**/tests/**"]
set.ignored = true

# Ignore OSError / TimeoutError hierarchy notes (TimeoutError is kept for readability)
[[triage]]
match.rules = ["radarlint-python:python:S5713"]
match.file_patterns = ["pyplumio/**"]
set.ignored = true

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "checkov"

[[plugin]]
name = "markdownlint"
mode = "comment"
drivers = [
  "lint",
]

[[plugin]]
name = "mypy"
extra_packages = [
  "serialx@1.15.1",
]

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-python"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"

[[plugin]]
name = "trivy"
drivers = [
  "config",
  "fs-vuln",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"
